[package]
name = "tmux-real"
version = "0.1.0"
edition = "2021"
description = "A tmux parody tool that posts pane viewports to a secret GitHub Gist if you miss the countdown"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/conao3/tmux-real"
homepage = "https://github.com/conao3/tmux-real"
keywords = ["tmux", "cli", "gist"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rand = "0.8"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
tempfile = "3.10"
which = "6.0"
